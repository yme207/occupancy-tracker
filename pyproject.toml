[project]
name = "occupancy-tracker"
version = "0.1.0"
description = "Home Assistant integration inferring whole-house and per-room occupancy from existing sensors and topology."
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "ASYNC", # flake8-async — catches blocking calls in async functions
  "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.occupancy_tracker"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
